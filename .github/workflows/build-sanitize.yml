name: CI (sanitize)

on:
  workflow_dispatch: # allows manual triggering
  push:
    branches:
      - master
    paths: [
      '.github/workflows/build-sanitize.yml',
      '**/CMakeLists.txt',
      '**/.cmake',
      '**/*.h',
      '**/*.hpp',
      '**/*.c',
      '**/*.cpp'
    ]

  pull_request:
    types: [opened, synchronize, reopened]
    # the meta backend shares one process between contexts that compute on different threads, and only a race
    # detector sees what that costs (spiceai/llama.cpp#9 reproduced a buffer-free race under ThreadSanitizer that
    # every other job passed), so a change to it or to its tests runs the sanitizers here
    paths: [
      '.github/workflows/build-sanitize.yml',
      'ggml/src/ggml-backend-meta.cpp',
      'ggml/src/ggml-backend-impl.h',
      'tests/test-meta-*.cpp'
    ]

cache-mode: none
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1

jobs:
  ctest:
    continue-on-error: true

    strategy:
      # thread and address doesn't run properly on some self hosted machines, so run it on Github instead; the UNDEFINED
      # leg's self-hosted runner does not exist for this repository's pull requests, where it would sit pending for good,
      # so a pull request runs that leg on GitHub too (the matrix context is not available in a job-level `if`)
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"sanitizer":"ADDRESS","machine":"ubuntu-24.04"},{"sanitizer":"THREAD","machine":"ubuntu-24.04"},{"sanitizer":"UNDEFINED","machine":"ubuntu-24.04"}]}' || '{"include":[{"sanitizer":"ADDRESS","machine":"ubuntu-24.04"},{"sanitizer":"THREAD","machine":"ubuntu-24.04"},{"sanitizer":"UNDEFINED","machine":["self-hosted","X64","Linux","CPU"]}]}') }}

    runs-on: ${{ matrix.machine }}

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      # - name: ccache
      #   uses: ggml-org/ccache-action@v1.2.24
      #   if: ${{ matrix.sanitizer != 'UNDEFINED' }}
      #   with:
      #     key: ctest-${{ matrix.sanitizer }}-ubuntu-24.04
      #     variant: ccache
      #     evict-old-files: 1d
      #     save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      # with UNDEFINED sanitizer, we have to build in Debug to avoid GCC 13 false-positive warnings
      - name: Build (undefined)
        id: cmake_build_undefined
        if: ${{ matrix.sanitizer == 'UNDEFINED' }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLLAMA_FATAL_WARNINGS=ON \
            -DLLAMA_SANITIZE_${{ matrix.sanitizer }}=ON \
            -DGGML_SANITIZE_${{ matrix.sanitizer }}=ON

          cmake --build build --config Debug -j $(nproc)

      - name: Build
        id: cmake_build
        if: ${{ matrix.sanitizer == 'ADDRESS' }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLLAMA_SANITIZE_${{ matrix.sanitizer }}=ON \
            -DGGML_SANITIZE_${{ matrix.sanitizer }}=ON

          cmake --build build --config RelWithDebInfo -j $(nproc)

      - name: Build (no OpenMP)
        id: cmake_build_no_openmp
        if: ${{ matrix.sanitizer == 'THREAD' }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLLAMA_SANITIZE_${{ matrix.sanitizer }}=ON \
            -DGGML_SANITIZE_${{ matrix.sanitizer }}=ON \
            -DGGML_OPENMP=OFF

          cmake --build build --config RelWithDebInfo -j $(nproc)

      - name: Test
        id: cmake_test
        run: |
          cd build
          ctest -L main -E tokenizer --verbose --timeout 900
